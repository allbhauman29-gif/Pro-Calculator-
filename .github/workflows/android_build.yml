name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Project
        run: |
          # Vite build command
          npm run build 

      - name: Capacitor Setup & Sync
        run: |
          # Agar config file nahi hai toh generate karein
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Pro Calculator" "com.procalc.app" --web-dir dist
          fi
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: pro-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
