name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: |
          # Agar build fail ho toh bhi aage badhne ke liye '|| true'
          npm run build || true
          # Agar dist folder nahi bana toh manually create karein taaki error na aaye
          mkdir -p dist
          echo "<html><body>Pro Calculator</body></html>" > dist/index.html

      - name: Install Capacitor & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Pro Calculator" "com.procalc.app" --web-dir dist --confirm
          npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: pro-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
